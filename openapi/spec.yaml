openapi: 3.0.3
info:
  title: Backend API
  version: 1.0.0
  description: Internal API supplying product/pricing data (bricks and
    construction products), transport costs and surcharges, plus dashboard
    configuration. Session-cookie auth; mutations and account management require
    authentication.
servers:
  - url: http://localhost:8080
    description: Local / internal (not externally accessible)
tags:
  - name: Health
  - name: Auth
  - name: Accounts
  - name: Locations
  - name: SourceLocations
  - name: Settlements
  - name: FeeCategories
  - name: Images
  - name: Products
  - name: Config
  - name: Consent
    description: 'Embedded @consenti/api GDPR consent management, mounted at
      /consenti (configurable via CONSENT_BASE_PATH). Consenti applies its own
      authentication and is not gated by the app session: the public
      consent-capture API under /consenti/api/v1/* is anonymous, while the admin
      dashboard at /consenti and the admin API under /consenti/admin/v1/* sit
      behind the consenti admin login (Bearer JWT from POST
      /consenti/admin/v1/auth/login). Only a summary is mirrored here; the
      complete, versioned schemas are served live by consenti at GET
      /consenti/api/openapi.json (public) and GET
      /consenti/api/openapi-admin.json (admin), with Swagger UI at
      /consenti/api/docs.'
security:
  - cookieAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid
  responses:
    BadRequest:
      description: Invalid request (validation failed)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or session expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict (duplicate or still referenced)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: No delivery route for this product/settlement combination
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Broken referential data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Upload exceeds the size limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too many login attempts from this client; please retry later
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        field:
          type: string
          description: When present, the input field responsible for the error (e.g. the
            field of a uniqueness conflict).
    IdResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
    NameResponse:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    CountResponse:
      type: object
      required:
        - total
      properties:
        total:
          type: integer
          minimum: 0
    Point:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum:
            - Point
        coordinates:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
          description: '[longitude, latitude]'
    Price:
      type: object
      required:
        - source
        - price
      properties:
        source:
          type: string
          description: Must match a registered source-location name
        price:
          type: number
          minimum: 0
    Distance:
      type: object
      required:
        - source
        - nearestLocation
        - distanceKm
      properties:
        source:
          type: string
        nearestLocation:
          type: string
          description: '"unavailable" when no location serves this source'
        distanceKm:
          type: number
          description: -1 when unavailable
    Location:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        postcode:
          type: integer
        municipality:
          type: string
        sapRegion:
          type: string
        salesWbRegion:
          type: string
        coordinates:
          $ref: '#/components/schemas/Point'
        prices:
          type: array
          items:
            $ref: '#/components/schemas/Price'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LocationInput:
      type: object
      required:
        - name
        - coordinates
      description: 'PATCH is a full overwrite: absent optional fields are cleared.'
      properties:
        name:
          type: string
          maxLength: 100
        coordinates:
          $ref: '#/components/schemas/Point'
        postcode:
          type: integer
          minimum: 0
        municipality:
          type: string
        sapRegion:
          type: string
        salesWbRegion:
          type: string
        prices:
          type: array
          items:
            $ref: '#/components/schemas/Price'
    LocationsImportResult:
      type: object
      required:
        - created
        - updated
        - total
      properties:
        created:
          type: integer
          minimum: 0
        updated:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    LocationsImportError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            type: string
          description: Per-row validation errors, present when the CSV failed row-level
            validation
    Settlement:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        coordinates:
          $ref: '#/components/schemas/Point'
        distances:
          type: array
          items:
            $ref: '#/components/schemas/Distance'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SettlementInput:
      type: object
      required:
        - name
        - coordinates
      properties:
        name:
          type: string
        coordinates:
          $ref: '#/components/schemas/Point'
    SourceLocation:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        truckCapacityKg:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SourceLocationInput:
      type: object
      required:
        - name
        - truckCapacityKg
      properties:
        name:
          type: string
        truckCapacityKg:
          type: integer
          minimum: 1
    SourceLocationUpdate:
      type: object
      required:
        - truckCapacityKg
      properties:
        truckCapacityKg:
          type: integer
          minimum: 1
    FeeCategory:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        percentage:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FeeCategoryInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        percentage:
          type: number
          minimum: 0
    FeeCategoryUpdate:
      type: object
      required:
        - percentage
      properties:
        percentage:
          type: number
          minimum: 0
    SystemComponentInputBase:
      type: object
      required:
        - name
        - kind
        - palletWeightKg
        - countPerPallet
        - minimumOrderUnits
        - sourceLocation
        - sapNumber
        - feeCategory
      properties:
        name:
          type: string
          maxLength: 100
        kind:
          type: string
          maxLength: 100
        unitsPerSquareMeter:
          type: number
          minimum: 0
          exclusiveMinimum: true
        palletWeightKg:
          type: number
          minimum: 0
          exclusiveMinimum: true
        countPerPallet:
          type: integer
          minimum: 1
        minimumOrderUnits:
          type: integer
          minimum: 1
        sourceLocation:
          type: string
          maxLength: 100
          description: Must match a source-location name
        sapNumber:
          type: string
          maxLength: 100
        feeCategory:
          type: string
          maxLength: 100
          description: Must match an existing fee category
    SystemComponentInputPiece:
      allOf:
        - $ref: '#/components/schemas/SystemComponentInputBase'
        - type: object
          required:
            - priceUnit
            - rawUnitPrice
          not:
            required:
              - pricePerSquareMeter
          properties:
            priceUnit:
              type: string
              enum:
                - бр.
            rawUnitPrice:
              type: number
              minimum: 0
              exclusiveMinimum: true
    SystemComponentInputSquareMeter:
      allOf:
        - $ref: '#/components/schemas/SystemComponentInputBase'
        - type: object
          required:
            - priceUnit
            - pricePerSquareMeter
          not:
            required:
              - rawUnitPrice
          properties:
            priceUnit:
              type: string
              enum:
                - m2
            pricePerSquareMeter:
              type: number
              minimum: 0
              exclusiveMinimum: true
    SystemComponentInput:
      description: 'Submit exactly one price: rawUnitPrice when priceUnit is "бр.", or
        pricePerSquareMeter when priceUnit is "m2". The other is derived
        server-side when unitsPerSquareMeter is present.'
      oneOf:
        - $ref: '#/components/schemas/SystemComponentInputPiece'
        - $ref: '#/components/schemas/SystemComponentInputSquareMeter'
      discriminator:
        propertyName: priceUnit
        mapping:
          бр.: '#/components/schemas/SystemComponentInputPiece'
          m2: '#/components/schemas/SystemComponentInputSquareMeter'
    SystemComponent:
      type: object
      description: unitWeightKg and weightPerSquareMeter are derived server-side; the
        price field not submitted (rawUnitPrice for "m2", pricePerSquareMeter
        for "бр.") is derived when unitsPerSquareMeter is present.
      properties:
        name:
          type: string
        kind:
          type: string
        priceUnit:
          type: string
          enum:
            - m2
            - бр.
        rawUnitPrice:
          type: number
        unitsPerSquareMeter:
          type: number
        palletWeightKg:
          type: number
        countPerPallet:
          type: integer
        minimumOrderUnits:
          type: integer
        sourceLocation:
          type: string
        sapNumber:
          type: string
        feeCategory:
          type: string
        unitWeightKg:
          type: number
        pricePerSquareMeter:
          type: number
        weightPerSquareMeter:
          type: number
    Product:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        kind:
          type: string
        variant:
          type: string
        system:
          type: string
        subtype:
          type: string
        comment:
          type: string
        countPerPallet:
          type: integer
        minimumOrderUnits:
          type: integer
        palletWeightKg:
          type: number
        priceUnit:
          type: string
          enum:
            - m2
            - бр.
        rawUnitPrice:
          type: number
        unitsPerSquareMeter:
          type: number
        unitWeightKg:
          type: number
        pricePerSquareMeter:
          type: number
        weightPerSquareMeter:
          type: number
        classification:
          type: string
        sourceLocation:
          type: string
        sapNumber:
          type: string
        feeCategory:
          type: string
        rasterSize:
          type: string
        iconLoad:
          type: string
        productionSource:
          type: string
          enum:
            - Внос
            - Местно производство
        systemComponents:
          type: array
          items:
            $ref: '#/components/schemas/SystemComponent'
        imageId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProductInputBase:
      type: object
      required:
        - name
        - kind
        - variant
        - system
        - subtype
        - countPerPallet
        - minimumOrderUnits
        - palletWeightKg
        - sourceLocation
        - sapNumber
        - feeCategory
        - productionSource
        - imageId
      properties:
        name:
          type: string
          maxLength: 100
        kind:
          type: string
          maxLength: 100
        variant:
          type: string
          maxLength: 100
        system:
          type: string
          maxLength: 150
        subtype:
          type: string
          maxLength: 100
        comment:
          type: string
          maxLength: 500
        countPerPallet:
          type: integer
          minimum: 1
        minimumOrderUnits:
          type: integer
          minimum: 1
        palletWeightKg:
          type: number
          minimum: 0
          exclusiveMinimum: true
        unitsPerSquareMeter:
          type: number
          minimum: 0
          exclusiveMinimum: true
        classification:
          type: string
          maxLength: 100
        sourceLocation:
          type: string
          maxLength: 100
          description: Must match a source-location name
        sapNumber:
          type: string
          maxLength: 100
        feeCategory:
          type: string
          maxLength: 100
          description: Must match an existing fee category
        rasterSize:
          type: string
          maxLength: 100
        iconLoad:
          type: string
          maxLength: 100
        productionSource:
          type: string
          enum:
            - Внос
            - Местно производство
        systemComponents:
          type: array
          description: Optional; defaults to empty. Same per-field validation as the
            matching product fields.
          items:
            $ref: '#/components/schemas/SystemComponentInput'
        imageId:
          type: string
          description: Must reference an existing, unbound image
    ProductInputPiece:
      allOf:
        - $ref: '#/components/schemas/ProductInputBase'
        - type: object
          required:
            - priceUnit
            - rawUnitPrice
          not:
            required:
              - pricePerSquareMeter
          properties:
            priceUnit:
              type: string
              enum:
                - бр.
            rawUnitPrice:
              type: number
              minimum: 0
              exclusiveMinimum: true
    ProductInputSquareMeter:
      allOf:
        - $ref: '#/components/schemas/ProductInputBase'
        - type: object
          required:
            - priceUnit
            - pricePerSquareMeter
          not:
            required:
              - rawUnitPrice
          properties:
            priceUnit:
              type: string
              enum:
                - m2
            pricePerSquareMeter:
              type: number
              minimum: 0
              exclusiveMinimum: true
    ProductInput:
      description: 'PATCH is a full overwrite: absent optional fields are cleared.
        Changing imageId re-binds the image. Submit exactly one price:
        rawUnitPrice when priceUnit is "бр.", or pricePerSquareMeter when
        priceUnit is "m2"; the other and unitWeightKg/weightPerSquareMeter are
        derived server-side and cannot be set.'
      oneOf:
        - $ref: '#/components/schemas/ProductInputPiece'
        - $ref: '#/components/schemas/ProductInputSquareMeter'
      discriminator:
        propertyName: priceUnit
        mapping:
          бр.: '#/components/schemas/ProductInputPiece'
          m2: '#/components/schemas/ProductInputSquareMeter'
    ProductImportSummary:
      type: object
      required:
        - created
        - updated
        - total
      properties:
        created:
          type: integer
          minimum: 0
        updated:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    ProductImportError:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            type: string
    Credentials:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    Account:
      type: object
      required:
        - id
        - username
      properties:
        id:
          type: string
        username:
          type: string
    UsernameResponse:
      type: object
      required:
        - username
      properties:
        username:
          type: string
    Config:
      type: object
      properties:
        _id:
          type: string
        vat:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConfigUpdate:
      type: object
      required:
        - vat
      properties:
        vat:
          type: number
          minimum: 0
    ProductPricing:
      type: object
      required:
        - nearestLocation
        - distanceKm
        - systemComponents
      properties:
        pricePerUnit:
          type: number
          description: Delivered price per unit incl. fee-category markup, transport and
            VAT (2dp); absent when rawUnitPrice is unavailable (priceUnit "m2"
            without unitsPerSquareMeter)
        pricePerSquareMeter:
          type: number
          description: Delivered price per m² incl. fee-category markup, transport and VAT
            (2dp); absent when the item has no unitsPerSquareMeter
        nearestLocation:
          type: string
        distanceKm:
          type: number
        systemComponents:
          type: array
          items:
            $ref: '#/components/schemas/ComponentPricing'
    ComponentPricing:
      type: object
      required:
        - name
        - nearestLocation
        - distanceKm
      properties:
        name:
          type: string
        pricePerUnit:
          type: number
        pricePerSquareMeter:
          type: number
        nearestLocation:
          type: string
        distanceKm:
          type: number
paths:
  /health:
    get:
      tags:
        - Health
      summary: Liveness check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
  /login:
    post:
      tags:
        - Auth
      summary: Log in (creates a session cookie)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Logged in; sets session cookie
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /accounts:
    get:
      tags:
        - Accounts
      summary: List all accounts (password hash excluded)
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Accounts
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /accounts/me:
    get:
      tags:
        - Accounts
      summary: Get the currently authenticated account
      responses:
        '200':
          description: Current account username
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /accounts/logout:
    post:
      tags:
        - Accounts
      summary: Log out of the current session (destroys the session and clears the
        cookie)
      responses:
        '200':
          description: Logged out; clears session cookie
        '401':
          $ref: '#/components/responses/Unauthorized'
  /accounts/{id}:
    get:
      tags:
        - Accounts
      summary: Get an account by id (password hash excluded)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ObjectId
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Accounts
      summary: Delete an account (cannot delete your own or the last one)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ObjectId
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /accounts/{id}/reset-login-attempts:
    post:
      tags:
        - Accounts
      summary: Reset an account's failed login attempts (unlock)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ObjectId
      responses:
        '200':
          description: Login attempts reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /locations:
    get:
      tags:
        - Locations
      summary: List locations
      security: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Page number (1-based); default 1. Windows the returned array; the
            response shape is unchanged (a bare array).
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Items per page (max 100); default 20. Windows the returned array;
            the response shape is unchanged (a bare array).
      responses:
        '200':
          description: Locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
        - Locations
      summary: Create a location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /locations/import:
    post:
      tags:
        - Locations
      summary: Bulk import locations from CSV (upsert by case-insensitive name;
        recomputes settlements)
      description: Accepts the raw locations CSV (same columns as the seed-locations
        script), converts and validates each row, then upserts by
        case-insensitive name — updating an existing location as a full
        overwrite or creating a new one — and triggers a settlement-distance
        recompute afterwards.
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationsImportResult'
        '400':
          description: Malformed CSV, per-row validation errors, unknown price sources, or
            duplicate names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationsImportError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /locations/export:
    get:
      tags:
        - Locations
      summary: Export all locations as CSV (same columns as the import)
      description: 'Returns every location as a CSV in the import format: fixed
        columns (City Name, Post code, Municipality, SAP region, Sales WB
        region), one column per price source, and a trailing Geo "lat,lng"
        column. Computed fields (settlement distances) and Mongo internals are
        excluded, so the output can be re-imported via POST /locations/import.'
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
