  /products/import:
    post:
      tags:
        - Products
      summary: Bulk import products from CSV (upsert by sapNumber)
      description: Accepts a text/csv body. Rows are grouped by (system, variant); the
        mainComponent="yes" row is the product and mainComponent="no" rows are
        its systemComponents. Each group is matched to an existing product by
        sapNumber and fully overwritten, or created if none matches. All rows
        are validated before any write; the import runs in a single
        all-or-nothing transaction. Numeric columns use "." as the decimal
        separator; the body is UTF-8 (a leading BOM is allowed).
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductImportSummary'
        '400':
          description: CSV validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductImportError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /products/export:
    get:
      tags:
        - Products
      summary: Export all products as CSV (same columns as the import)
      description: 'Returns every product as a CSV in the import format: one
        mainComponent="yes" row per product followed by a mainComponent="no" row
        per systemComponent, sharing the parent (system, variant). Each row
        carries priceUnit and only its native price (rawUnitPrice for "бр.",
        pricePerSquareMeter for "m2"); the server-derived price of the other
        unit, plus unitWeightKg/weightPerSquareMeter and Mongo internals, are
        excluded, so the output can be re-imported via POST /products/import.'
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
